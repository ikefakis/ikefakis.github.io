    summary: |
      Front-end Software Developer with 8+ years of hands-on experience building
      scalable, high-performance web applications. Specialising in modern JavaScript
      ecosystems — Angular, React, and Node.js — with a strong focus on component
      architecture, clean code, and developer experience. Comfortable across the
      full stack, from REST/GraphQL APIs to CI/CD pipelines and containerised
      deployments. Passionate about crafting intuitive UIs, adopting emerging
      technologies, and shipping production-quality software in agile teams.
